# Supabase local config. Enough to run the project locally with the CLI:
#   supabase start      -> boots Postgres + Auth + Studio in Docker
#   supabase db reset   -> recreates the DB, applies all migrations, runs seed.sql
# Everything below uses the standard local ports; change them only if they clash.

project_id = "singlestack"

[api]
enabled = true
port = 54321
# Schemas exposed over the auto-generated REST/GraphQL API.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Postgres major version. Matches Supabase's current default.
major_version = 15

[db.seed]
# Run supabase/seed.sql on `db reset` (the one org + worked example).
# Production deploys apply migrations only — this seed never runs there.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
# The local dashboard UI at http://127.0.0.1:54323
enabled = true
port = 54323

[auth]
# Local Auth — needed so signups create auth.users rows, which fires the
# on_auth_user_created trigger that auto-joins the user to the org.
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = true

[auth.email]
enable_signup = true
# No email confirmation locally, so test signups are instant.
enable_confirmations = false

# Browser-invoked functions: verify_jwt = false at the GATEWAY.
#
# Why not true: with verify_jwt = true the platform gateway rejects the CORS
# preflight (OPTIONS carries no JWT), so the browser blocks the call and
# supabase-js reports "Failed to send a request to the Edge Function" — for every
# function, even though they're deployed.
#
# Why it's safe: each of these functions enforces auth ITSELF — it requires the
# caller's Authorization header (401 otherwise) and creates its Supabase client
# with that JWT, so every read/write is still org-scoped by RLS. The gateway
# check was redundant with the function's own check.
[functions.agent-propose]
verify_jwt = false
[functions.agent-chat]
verify_jwt = false
[functions.synthesize-signals]
verify_jwt = false
[functions.connector-runner]
verify_jwt = false
[functions.distill-lessons]
verify_jwt = false
[functions.evolve-skills]
verify_jwt = false
[functions.orchestrate-roster]
verify_jwt = false
[functions.propose-bridges]
verify_jwt = false
[functions.resolve-intel-update]
verify_jwt = false
[functions.source-recipe]
verify_jwt = false
[functions.import-record]
verify_jwt = false
[functions.draft-cornerstone]
verify_jwt = false
[functions.synthesize-profile]
verify_jwt = false
[functions.profile-to-strategy]
verify_jwt = false
[functions.scheduled-pulls]
verify_jwt = false
[functions.outcome-watch]
verify_jwt = false
[functions.usage-ingest]
verify_jwt = false
