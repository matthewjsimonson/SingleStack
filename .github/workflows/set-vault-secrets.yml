name: Set Vault secrets (heartbeat)

# One-time (re-runnable) helper to arm the heartbeat. The hourly cron jobs
# (migration 20260609000001) read two Vault secrets at tick time —
#   • project_url       — https://<ref>.supabase.co
#   • service_role_key  — the key the machine functions authenticate with
# — and no-op until they exist. This workflow writes both, idempotently, over
# the same session-pooler connection the deploy uses. Manual only (it touches
# the service-role key): Actions → "Set Vault secrets (heartbeat)" → Run.
#
# Requires, on the chosen GitHub Environment, the deploy secrets PLUS one new:
#   SUPABASE_PROJECT_REF   • SUPABASE_DB_PASSWORD   • SUPABASE_SERVICE_ROLE_KEY
# Run once per tier after the migration has deployed. Verify in SQL:
#   select jobname, schedule from cron.job;

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier (the GitHub Environment holding this project's secrets)"
        required: true
        type: choice
        options: [development, demo]
        default: development

jobs:
  set-vault-secrets:
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Guard — required secrets present
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing on the '${{ inputs.tier }}' Environment:$missing. (SUPABASE_SERVICE_ROLE_KEY is new — add it: Settings → Environments → ${{ inputs.tier }} → Secrets. It's in the Supabase dashboard under Project Settings → API → service_role.)"
            exit 1
          fi
          echo "Arming heartbeat for project ref: ${PROJECT_REF}"

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Upsert Vault secrets over the session pooler
        run: |
          # Same pooler map as deploy-supabase.yml — keep in sync.
          case "$PROJECT_REF" in
            fthnutnmpoymcrbvijku) POOLER_HOST="aws-1-us-west-1.pooler.supabase.com" ;;  # singlestack-dev
            pzulufyoqvqevjrmtmfj) POOLER_HOST="aws-0-us-west-2.pooler.supabase.com" ;;  # demo
            *) echo "::error::No Session pooler host mapped for project ref '${PROJECT_REF}'. Add it (Connect → Session pooler) to the case below and in deploy-supabase.yml."; exit 1 ;;
          esac
          ENC_PW="$(printf '%s' "${SUPABASE_DB_PASSWORD%$'\n'}" | jq -sRr @uri)"
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${POOLER_HOST}:5432/postgres?sslmode=require"
          PROJECT_URL="https://${PROJECT_REF}.supabase.co"
          # Idempotent + atomic: delete any prior copies, recreate both. Values
          # arrive as psql vars (-v) so they're never printed; GitHub also masks
          # the registered secrets in logs. The invoker reads by NAME, so the
          # regenerated secret ids don't matter.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q \
            -v url="$PROJECT_URL" -v svc="$SERVICE_ROLE_KEY" \
            -c "begin;
                delete from vault.secrets where name in ('project_url','service_role_key');
                select vault.create_secret(:'url', 'project_url',       'heartbeat: project base URL');
                select vault.create_secret(:'svc', 'service_role_key',  'heartbeat: service role key for machine functions');
                commit;" >/dev/null
          echo "✓ Vault secrets set (project_url + service_role_key)."

      - name: Verify cron jobs are scheduled
        run: |
          case "$PROJECT_REF" in
            fthnutnmpoymcrbvijku) POOLER_HOST="aws-1-us-west-1.pooler.supabase.com" ;;
            pzulufyoqvqevjrmtmfj) POOLER_HOST="aws-0-us-west-2.pooler.supabase.com" ;;
          esac
          ENC_PW="$(printf '%s' "${SUPABASE_DB_PASSWORD%$'\n'}" | jq -sRr @uri)"
          DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${POOLER_HOST}:5432/postgres?sslmode=require"
          echo "Scheduled jobs (expect singlestack-scheduled-pulls @ :12 and singlestack-outcome-watch @ :27):"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "select jobname || '  ' || schedule from cron.job where jobname like 'singlestack-%' order by jobname;"
          echo "Heartbeat armed. Next tick will run; nothing else to do."
