name: Deploy to Supabase

# ============================================================================
# Branch-aware migration deploy. One workflow, two isolated tiers (free-tier
# friendly: 2 Supabase projects). Each git branch maps to its own GitHub
# Environment, which holds that tier's Supabase secrets. The code is identical
# across tiers; only the target project differs.
#
#   branch     →  GitHub Environment  →  Supabase project (via env secrets)
#   ------------------------------------------------------------------------
#   develop    →  development         →  singlestack-dev          (throwaway data)
#   main       →  demo                →  pzulufyoqvqevjrmtmfj     (demo data)
#
# (A third "production" tier can be added later — create a prod project, add a
# `staging`/`main` split + a `production` Environment. Left out for now to fit
# the free tier's 2-project limit.)
#
# Each Environment (GitHub → Settings → Environments) defines three secrets:
#   SUPABASE_PROJECT_REF   — the project ref, e.g. abcdwxyz12345678
#   SUPABASE_DB_PASSWORD   — that project's database password (alphanumeric)
#   SUPABASE_ACCESS_TOKEN  — a personal access token for the Supabase account
# ============================================================================

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      tier:
        description: "Tier to deploy (manual run)"
        type: choice
        options: [development, demo]
        default: development

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pick the Environment from the branch (push) or the chosen tier (manual).
    # The Environment scopes which set of secrets this run can read.
    #   main    → demo        (the existing project)
    #   develop → development  (the new dev project)
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && inputs.tier
        || github.ref_name == 'main' && 'demo'
        || 'development'
      }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Opt JS actions into Node 24 ahead of the June 2026 forced cutover
      # (clears the Node 20 deprecation warning).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Guard — required secrets present
        # Fail loudly (not silently against the wrong DB) if an Environment
        # hasn't been configured yet.
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing Supabase secrets for this Environment. Set SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, and SUPABASE_ACCESS_TOKEN on the GitHub Environment for this tier."
            exit 1
          fi
          echo "Deploying to project ref: ${PROJECT_REF}"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations (via session pooler, port 5432)
        # The CLI's default pooler selection lands on transaction mode (6543),
        # which rejected auth here and is the wrong mode for migrations anyway.
        # Point db push at the SESSION pooler (5432) explicitly.
        #
        # The pooler hostname is per-project (region + pooler cluster) and is
        # NOT derivable from the ref, so map each project to its Session pooler
        # host. Find a project's host in the dashboard: Connect → Session pooler.
        run: |
          case "$PROJECT_REF" in
            fthnutnmpoymcrbvijku) POOLER_HOST="aws-1-us-west-1.pooler.supabase.com" ;;  # singlestack-dev
            pzulufyoqvqevjrmtmfj) POOLER_HOST="aws-0-us-west-2.pooler.supabase.com" ;;  # demo
            *)
              echo "::error::No Session pooler host mapped for project ref '${PROJECT_REF}'. Add its host (Connect → Session pooler) to the case in deploy-supabase.yml."
              exit 1
              ;;
          esac
          echo "Using pooler host: ${POOLER_HOST}"
          # URL-encode the password so ANY character (@ : / # % ? ...) is safe
          # inline in the connection URL. An un-encoded special char silently
          # truncates the password and yields a misleading 28P01 "password
          # authentication failed" — even when the stored password is correct.
          # Strip a stray trailing newline a pasted secret may carry, too.
          RAW_PW="${SUPABASE_DB_PASSWORD%$'\n'}"
          ENC_PW="$(printf '%s' "$RAW_PW" | jq -sRr @uri)"
          supabase db push --db-url "postgresql://postgres.${PROJECT_REF}:${ENC_PW}@${POOLER_HOST}:5432/postgres?sslmode=require"

      - name: Deploy Edge Functions
        # Deploy each function INDIVIDUALLY rather than as one bulk command. A
        # single bulk `functions deploy` is all-or-nothing: if one function fails
        # to bundle, the command exits non-zero and NONE of them deploy — which
        # silently breaks every AI feature (the client then gets "Failed to send
        # a request to the Edge Function"). Looping isolates failures: the good
        # functions still deploy, and the log names any that fail.
        # Functions read their own secrets (e.g. ANTHROPIC_API_KEY) set per-
        # project in the Supabase dashboard.
        run: |
          if [ ! -d supabase/functions ]; then echo "No supabase/functions — skipping."; exit 0; fi
          failed=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue;; esac          # skip _shared and the like
            [ -f "${dir}index.ts" ] || { echo "skip ${name} (no index.ts)"; continue; }
            echo "::group::deploy ${name}"
            if supabase functions deploy "$name" --no-verify-jwt --project-ref "$PROJECT_REF"; then
              echo "deployed ${name}"
            else
              echo "::error::function ${name} failed to deploy"
              failed="${failed} ${name}"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Functions that failed:${failed}"; exit 1; fi
          echo "All functions deployed."
